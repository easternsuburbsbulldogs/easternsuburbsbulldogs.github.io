# Publishes the website to GitHub Pages.
# Runs on every change pushed to main, on a schedule (to bring in new Play AFL news), and on demand
# from the Actions tab ("Run workflow"). GitHub runs scheduled jobs when it has capacity, so in
# practice the schedule fires every few hours rather than exactly hourly.
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to save new club pages made from Play AFL stories back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bring in Play AFL news about the club
        run: node tools/fetch-playafl-news.mjs public/news.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shrink Play AFL images to small WebP copies hosted on our site
        run: |
          pip install --quiet pillow
          python tools/playafl_images.py public/news.json public/playafl

      - name: Make club news pages for new Play AFL stories and list them
        run: |
          python tools/playafl_articles.py public
          python tools/news_index.py public
          python tools/seo.py public https://www.unswesbulldogs.com.au

      - name: Save new club pages to the repo (only when there are new ones)
        run: |
          if [ -n "$(git status --porcelain -- public/news/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/news public/playafl public/sitemap.xml
            git commit -m "Add club news from Play AFL"
            git pull --rebase --autostash && git push
          fi

      - name: Leave out files that are not part of the public site
        run: rm -f public/news/_template.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      # GitHub's deploy service occasionally can't see the package it was just given
      # ("No artifacts named github-pages were found"). Wait and try once more before failing.
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying
        if: steps.first.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
